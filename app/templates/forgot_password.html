<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password | CCTV AI Guard</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="login-body">
    <div class="login-box">
      <h2>Reset your password</h2>
      <p class="login-note">Enter your verified email and we will send a reset code.</p>
      {% if message %}<p class="form-success">{{ message }}</p>{% endif %}
      <form method="post" action="/forgot-password">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
        <button type="submit">Send reset code</button>
      </form>
      <p class="login-note"><a href="/login">Back to sign in</a></p>
    </div>
  </body>
</html>
