<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify email | CCTV AI Guard</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="login-body">
    <div class="login-box">
      <h2>Verify your email</h2>
      <p class="login-note">Enter the 6-digit code sent to your email.</p>
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <form method="post" action="/verify">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ email }}" required />
        <label for="code">Verification code</label>
        <input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required />
        <button type="submit">Verify email</button>
      </form>
      <p class="login-note"><a href="/login">Return to sign in</a></p>
    </div>
  </body>
</html>
