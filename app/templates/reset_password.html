<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set new password | CCTV AI Guard</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="login-body">
    <div class="login-box">
      <h2>Set a new password</h2>
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <form method="post" action="/reset-password">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ email }}" required />
        <label for="code">Reset code</label>
        <input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required />
        <label for="password">New password</label>
        <input id="password" name="password" type="password" minlength="8" required />
        <button type="submit">Update password</button>
      </form>
      <p class="login-note"><a href="/login">Back to sign in</a></p>
    </div>
  </body>
</html>
