<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | CCTV AI Guard</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="login-body">
    <div class="login-box">
      <h2>Create account</h2>
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <form method="post" action="/register">
        <label for="name">Name</label>
        <input id="name" name="name" required />
        <label for="username">Username</label>
        <input id="username" name="username" required />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8" required />
        <button type="submit">Register</button>
      </form>
      <p class="login-note"><a href="/login">Already have an account? Sign in</a></p>
      <p class="legal-links"><a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/support">Support</a></p>
    </div>
  </body>
</html>
