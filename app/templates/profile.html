<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | CCTV AI Guard</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="login-body">
    <div class="login-box">
      <h2>Your profile</h2>
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      {% if message %}<p class="form-success">{{ message }}</p>{% endif %}
      <form method="post" action="/profile/settings">
        <label for="username">Username</label>
        <input id="username" value="{{ user.username }}" disabled />
        <label for="name">Name</label>
        <input id="name" name="name" value="{{ user.name }}" required />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ user.email }}" required />
        <label for="password">New password</label>
        <input id="password" name="password" type="password" minlength="8" placeholder="Leave blank to keep current" />
        <button type="submit">Save profile</button>
      </form>
      <p class="login-note"><a href="/">Back to dashboard</a></p>
      <form method="post" action="/logout"><button class="secondary" type="submit">Log out</button></form>
    </div>
  </body>
</html>
