<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify profile access | CCTV AI Guard</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="login-body">
    <div class="login-box">
      <h2>Confirm your password</h2>
      <p class="login-note">Enter your current password to open profile settings.</p>
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <form method="post" action="/profile/verify">
        <input type="hidden" name="next_path" value="{{ next_path or '' }}" />
        <label for="password">Current password</label>
        <input id="password" name="password" type="password" required autofocus />
        <button type="submit">Continue</button>
      </form>
      <p class="login-note"><a href="/">Back to dashboard</a></p>
    </div>
  </body>
</html>
