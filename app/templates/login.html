<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | CCTV AI Guard</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="login-body">
    <div class="login-box">
      <h2>Sign in</h2>
      {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required />

        <button type="submit">Login</button>
      </form>
      <div class="login-links">
        <a href="/forgot-password">Forgot password?</a>
        <a href="/forgot-username">Forgot username?</a>
      </div>
      <p class="create-account"><a href="/register">Create an account</a></p>
      <p class="legal-links"><a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/support">Support</a></p>
    </div>
  </body>
</html>
